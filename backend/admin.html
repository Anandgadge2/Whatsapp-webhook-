<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forest Department – Admin Panel</title>

<style>
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: #eef2f3;
    margin: 0;
    padding: 20px;
  }

  h2 {
    color: #1d4f3a;
    margin-bottom: 20px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    border-radius: 10px;
    overflow: hidden;
  }

  th {
    background: #2f855a;
    color: white;
    padding: 12px;
    font-size: 14px;
  }

  td {
    padding: 10px;
    border-bottom: 1px solid #ddd;
    text-align: center;
    font-size: 14px;
  }

  tr:hover {
    background: #f4f9f6;
  }

  .status-pending { background: #fff3cd; }
  .status-progress { background: #cce5ff; }
  .status-resolved { background: #d4edda; }

  img {
    width: 70px;
    height: 70px;
    object-fit: cover;
    border-radius: 6px;
    border: 1px solid #ccc;
  }

  button {
    padding: 6px 14px;
    border: none;
    background: #2f855a;
    color: white;
    border-radius: 5px;
    cursor: pointer;
    transition: 0.2s;
  }

  button:hover {
    background: #276749;
  }

  select, input {
    padding: 6px;
    border-radius: 5px;
    border: 1px solid #bbb;
  }

  /* Map thumbnail styling */
 .map-thumb {
  width: 90px;
  height: 90px;
  border-radius: 6px;
  border: 1px solid #ccc;
  object-fit: cover;
}




</style>
</head>
<body>

<h2>Forest Control – Complaints Dashboard</h2>

<table>
  <thead>
    <tr>
      <th>User Phone</th>
      <th>Type</th>
      <th>Location</th>
      <th>Description</th>
      <th>Image</th>
      <th>Status</th>
      <th>Officer</th>
      <th>Action</th>
    </tr>
  </thead>

  <tbody id="complaintsTable"></tbody>
</table>


<script>
const table = document.getElementById("complaintsTable");

async function loadComplaints() {
  try {
    const res = await fetch("http://localhost:3000/admin/complaints");
    const data = await res.json();

    table.innerHTML = "";

    data.forEach(c => {
      const lat = c.location?.latitude;
      const lon = c.location?.longitude;

      const hasLocation = lat && lon;

      // OpenStreetMap static map (FREE, NO KEY REQUIRED)
     const mapPreview = hasLocation
  ? `
    <a href="https://yandex.com/maps/?ll=${lon}%2C${lat}&z=16"
       target="_blank">
        <img 
          src="https://static-maps.yandex.ru/1.x/?lang=en-US&ll=${lon},${lat}&z=14&size=200,200&l=map&pt=${lon},${lat},pm2rdm"
          class="map-thumb"
        />
    </a>
  `
  : "N/A";



      const img = c.imageUrl
        ? `<a href="${c.imageUrl}" target="_blank"><img src="${c.imageUrl}" /></a>`
        : "N/A";

      const row = `
        <tr>
          <td>${c.phone}</td>
          <td>${c.type}</td>
          <td>${mapPreview}</td>
          <td>${c.message || ""}</td>
          <td>${img}</td>

          <td>
            <select id="status-${c._id}">
              <option value="PENDING" ${c.status === "PENDING" ? "selected" : ""}>PENDING</option>
              <option value="IN_PROGRESS" ${c.status === "IN_PROGRESS" ? "selected" : ""}>IN_PROGRESS</option>
              <option value="RESOLVED" ${c.status === "RESOLVED" ? "selected" : ""}>RESOLVED</option>
            </select>
          </td>

          <td>
            <input type="text" id="officer-${c._id}" value="${c.officerName || ''}" />
          </td>

          <td>
            <button onclick="updateStatus('${c._id}')">Save</button>
          </td>
        </tr>
      `;

      table.innerHTML += row;
    });

  } catch (err) {
    console.error("Error loading complaints:", err);
  }
}

async function updateStatus(id) {
  const status = document.getElementById(`status-${id}`).value;
  const officerName = document.getElementById(`officer-${id}`).value;

  try {
    await fetch(`http://localhost:3000/admin/complaints/${id}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ status, officerName })
    });

    alert("Updated successfully");
    loadComplaints();

  } catch (err) {
    console.error("Update error:", err);
    alert("Update failed");
  }
}

loadComplaints();
setInterval(loadComplaints, 5000);
</script>


</body>
</html>
