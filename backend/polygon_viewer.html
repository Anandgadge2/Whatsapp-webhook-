<!DOCTYPE html>
<html>
<head>
  <title>Polygon Visualizer</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <style>
    #map { height: 100vh; width: 100%; }
  </style>
</head>
<body>
<div id="map"></div>

<script>
const map = L.map('map').setView([21.1108, 79.0628], 14);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
}).addTo(map);

// Paste polygon from MySQL -> poly_lat_lng JSON array
const polygon = [
  {"lat":21.110776094484663,"lng":79.06286128860648},
  {"lat":21.11084615592061,"lng":79.06276338797744},
  {"lat":21.110902455264817,"lng":79.06280630332168},
  {"lat":21.110958754587646,"lng":79.06292968493636},
  {"lat":21.11088994430128,"lng":79.06297662359412},
  {"lat":21.11081362740089,"lng":79.06292163830932}
];

L.polygon(polygon, { color: 'red' }).addTo(map);
</script>
</body>
</html>
